<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Notas Accesible</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <!-- Un solo h1 principal solicitado en la guía -->
        <h1>Mis Notas Personales</h1>
    </header>

    <main>
        <!-- Formulario para agregar notas -->
        <section class="form-section">
            <form id="note-form">
                <div class="form-group">
                    <label id="label-textarea" for="note-text">Escribe el contenido de tu nota:</label>
                    <textarea 
                        id="note-text" 
                        placeholder="Ej. Comprar ingredientes para la cena..." 
                        aria-labelledby="label-textarea"
                        required></textarea>
                </div>
                <!-- El botón inicia deshabilitado para prevenir notas vacías -->
                <button type="submit" id="submit-btn" disabled>Guardar Nota</button>
            </form>
        </section>

        <!-- Contenedor de notificaciones / Feedback para el usuario -->
        <div id="toast-container" aria-live="polite" role="status"></div>

        <!-- Listado de notas -->
        <section class="notes-section">
            <h2>Tus Notas</h2>
            <ul id="notes-list">
                <!-- Las notas se generarán dinámicamente aquí -->
            </ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
